# Preserve the original escaped upstream URL, including signed query strings.
map $request_uri $canvas_proxy_uri {
    ~^/canvas-proxy(?<canvas_proxy_path>/.*)$ $canvas_proxy_path;
    default /;
}

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /canvas-proxy {
        return 308 /canvas-proxy/;
    }

    location ^~ /canvas-proxy/ {
        resolver 127.0.0.11 ipv6=off;
        proxy_pass http://proxy:23210$canvas_proxy_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Upstream URLs can contain signed query strings; do not log them.
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
